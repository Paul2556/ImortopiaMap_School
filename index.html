<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Imortopia Map</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #0b0f14;
    color: white;
}

/* TOP BAR */
.topbar {
    display: flex;
    justify-content: space-between;
    padding: 12px 16px;
    background: #0f1720;
    font-weight: bold;
}

/* MAP */
.map-container {
    width: 100%;
    height: calc(100vh - 50px);
}

svg {
    width: 100%;
    height: 100%;
}

/* ZONES */
.zone {
    stroke: #ffffff30;
    stroke-width: 2;
    cursor: pointer;
}

.zone:hover {
    filter: brightness(1.3);
}

.label {
    fill: white;
    font-size: 18px;
    font-weight: bold;
    pointer-events: none;
}

.rr {
    fill: red;
    font-size: 10px;
}

.close-btn {
    position: absolute;
    top: 10px;
    right: 12px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    color: white;
}

.close-btn:hover {
    color: white;
}
/* COLORS */
.c1 { fill: #3b82f6; }
.c3 { fill: #22c55e; }
.c4 { fill: #eab308; }
.c5 { fill: #f97316; }
.c7 { fill: #f97316; } /* fixed from red */
.c8 { fill: #a855f7; }
.c9 { fill: #ec4899; }
.c10 { fill: #14b8a6; }
.c11 { fill: #6366f1; }
.c12 { fill: #facc15; }
.c13 { fill: #1f2937; }
.cred { fill: #dc2626; }

/* POPUP */
.popup {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: #111827;
    padding: 20px;
    border-radius: 10px;
    border: 1px solid #1f2a38;
    width: 80%;
    max-width: 400px;
    text-align: center;

    z-index: 9999;

    position: relative; /* this makes ✕ work */
}

#popup-content {
    margin-top: 10px;
}
/* make popup visible above everything */
.hidden {
    display: none;
}

/* LEGEND DRAWER */
.legend {
    position: fixed;
    top: 0;
    right: 0;
    width: 80%;
    height: 100%;
    background: #0f1720;
    padding: 20px;
    overflow-y: auto;
}
</style>
</head>

<body>

<div class="topbar">
    <span>Imortopia Map</span>
    <button onclick="toggleLegend()">☰</button>
</div>

<div class="map-container">
<svg viewBox="0 0 900 750" preserveAspectRatio="xMidYMid meet">

    <!-- 13 MAIN -->
    <rect class="zone c13" x="50" y="100" width="250" height="450"
        onclick="show(13)"/>
    <text x="175" y="350" text-anchor="middle" dominant-baseline="middle" class="label">13</text>

    <!-- 2 TRIANGLE -->
    <polygon class="zone cred"
        points="50,250 50,330 20,290"
        onclick="show(2)"/>
    <text x="35" y="290" class="label">2</text>
    <text x="30" y="270" class="rr">RR</text>

    <!-- 11 -->
    <rect class="zone c11" x="320" y="80" width="120" height="60"
        onclick="show(11)"/>
    <text x="380" y="110" text-anchor="middle" dominant-baseline="middle" class="label">11</text>

    <!-- 7 -->
    <rect class="zone c7" x="460" y="80" width="200" height="60"
        onclick="show(7)"/>
    <text x="560" y="110" text-anchor="middle" dominant-baseline="middle" class="label">7</text>

    <!-- 12 -->
    <rect class="zone c12" x="350" y="160" width="140" height="140"
        onclick="show(12)"/>
    <text x="420" y="230" text-anchor="middle" dominant-baseline="middle" class="label">12</text>

    <!-- 8 -->
    <rect class="zone c8" x="510" y="160" width="140" height="140"
        onclick="show(8)"/>
    <text x="580" y="230" text-anchor="middle" dominant-baseline="middle" class="label">8</text>

    <!-- 9 -->
    <rect class="zone c9" x="510" y="320" width="160" height="180"
        onclick="show(9)"/>
    <text x="590" y="410" text-anchor="middle" dominant-baseline="middle" class="label">9</text>

    <!-- 10 -->
    <rect class="zone c10" x="380" y="520" width="260" height="70"
        onclick="show(10)"/>
    <text x="510" y="555" text-anchor="middle" dominant-baseline="middle" class="label">10</text>

    <!-- R (correct alignment) -->
    <rect class="zone" x="390" y="350" width="70" height="70"
        fill="#374151"
        onclick="show('R')"/>
    <text x="425" y="385"
        text-anchor="middle"
        dominant-baseline="middle"
        style="font-size:28px; font-weight:bold; fill:white;">R</text>

    <!-- RIGHT COLUMN -->
    <rect class="zone c1" x="700" y="100" width="70" height="90"
        onclick="show(1)"/>
    <text x="735" y="145" text-anchor="middle" dominant-baseline="middle" class="label">1</text>

    <rect class="zone c13" x="700" y="200" width="70" height="90"
        onclick="show(13)"/>
    <text x="735" y="245" text-anchor="middle" dominant-baseline="middle" class="label">13</text>

    <rect class="zone c3" x="700" y="300" width="70" height="90"
        onclick="show(3)"/>
    <text x="735" y="345" text-anchor="middle" dominant-baseline="middle" class="label">3</text>

    <rect class="zone c4" x="700" y="400" width="70" height="90"
        onclick="show(4)"/>
    <text x="735" y="445" text-anchor="middle" dominant-baseline="middle" class="label">4</text>

    <rect class="zone c5" x="700" y="500" width="70" height="90"
        onclick="show(5)"/>
    <text x="735" y="545" text-anchor="middle" dominant-baseline="middle" class="label">5</text>

    <!-- 6 -->
    <polygon class="zone cred"
        points="700,610 780,610 780,730 700,700"
        onclick="show(6)"/>
    <text x="740" y="670" class="label">6</text>
    <text x="760" y="620" class="rr">RR</text>

</svg>
</div>

<div id="popup" class="popup hidden">
    <span class="close-btn" onclick="closePopup()">✕</span>
    <div id="popup-content"></div>
</div>

<div id="legend" class="legend hidden">
    <h3>Legend</h3>
    <p>1 HCC Hotel</p>
    <p>3 FREE FLY™ Service</p>
    <p>4 FREE FLY™ Register</p>
    <p>5 Elevator</p>
    <p>7 Colosseum Fight</p>
    <p>8 Gift Shop</p>
    <p>9 Disco Floor</p>
    <p>10 Guillotine Service</p>
    <p>11 Ship of Chaos</p>
    <p>12 Cafe</p>
    <p>13 FPS in Reality™</p>

    <h4>Restricted</h4>
    <p>2 Staff Only (RR)</p>
    <p>6 Select Personnel Only (RR)</p>
</div>

<script>
function show(id){
    const data = {
        1: "HCC Hotel",
        2: "Restrictive Staff Only (RR)",
        3: "FREE FLY™ Service",
        4: "FREE FLY™ Register",
        5: "Elevator",
        6: "Restrictive Select Personal Only (RR)",
        7: "Colosseum Fight",
        8: "Gift Shop",
        9: "Disco Floor",
        10: "Guillotine Service",
        11: "Ship of Chaos",
        12: "Cafe",
        13: "FPS in Reality™ (Battleground/Register)",
        "R": "Respawn Point"
    };

    document.getElementById("popup-content").innerHTML =
        "<b>" + id + "</b><br>" + data[id];

    document.getElementById("popup").classList.remove("hidden");
}

function closePopup(){
    document.getElementById("popup").classList.add("hidden");
}

function toggleLegend(){
    document.getElementById("legend").classList.toggle("hidden");
}
</script>

</body>
</html>
